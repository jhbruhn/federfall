# Federfall — LOCAL DEV overrides, auto-merged by `docker compose up` on top of
# docker-compose.yml. NOT used in production (deploy runs an explicit
# `-f docker-compose.yml`, which skips this file).
#
# Dev builds the SAME full image as production (PocketBase + the baked Flutter web
# SPA), so `docker compose up` serves the whole app on http://localhost:8090. The
# override only relaxes the RUNTIME, not the image:
#   - bind-mount the existing local pb_data so dev data persists on the host,
#   - bind-mount pb_migrations/ so new Admin-UI migrations land back on the host,
#   - automigrate ON so Admin-UI schema changes are written as .js migration files.
#
# ── pb_hooks/ and typst/ are NOT bind-mounted, and must not be ───────────────
#
# A bind-mount REPLACES the whole directory. Both of those directories are
# assembled from two sources — zugvogel-pb-base lays down the shared half, and the
# Dockerfile COPYs federfall's own half into the same place — so mounting
# federfall's half alone deletes the shared half from the container:
#
#   /pb/pb_hooks  the thirteen zv_*.js libraries. 21 of federfall's hook files
#                 `require()` one, so the first hook PocketBase loads dies with
#                 "GoError: Invalid module" and the container exits 1 in a restart
#                 loop. Loud, but misleading: the message names
#                 audit_domain.pb.js, whose own require path is correct.
#   /pb/typst     zv_report_common.typ, which report_common.typ imports. That one
#                 does not fail at boot — it waits for the first PDF request.
#
# Editing a hook or a .typ template therefore needs `docker compose up --build`.
# It is a cached COPY layer near the end of the Dockerfile, so it takes seconds,
# and dev now runs the same file layout as production instead of one assembled by
# mounts. pb_migrations/ stays mounted because the base image ships no
# /pb/pb_migrations at all — there is nothing there to shadow.
#
# For UI hot-reload, run the app on the host with `flutter run` (the dev flavor
# points POCKETBASE_URL at localhost:8090) instead of using the baked SPA.

services:
  app:
    environment:
      # Dev-only: auto-create a known app Supervisor on first run (see
      # pb_hooks/bootstrap_supervisor.pb.js) so you can log in immediately.
      # NEVER use these credentials in production.
      FEDERFALL_SUPERVISOR_EMAIL: "supervisor@federfall.local"
      FEDERFALL_SUPERVISOR_PASSWORD: "supervisor"
      FEDERFALL_SUPERVISOR_NAME: "Dev Supervisor"
    volumes:
      - ./backend/pocketbase/pb_data:/pb/pb_data
      - ./backend/pocketbase/pb_migrations:/pb/pb_migrations
    command:
      - "serve"
      - "--http=0.0.0.0:8090"
      - "--dir=/pb/pb_data"
      - "--migrationsDir=/pb/pb_migrations"
      - "--hooksDir=/pb/pb_hooks"
      - "--publicDir=/pb/pb_public"
      - "--automigrate=1"
      - "--dev"
